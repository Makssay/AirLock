<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#f1f5fa"/><g font-family="Arial,sans-serif" fill="#182e4a"><text x="70" y="90" font-size="40" font-weight="700">Airlock: authority has boundaries</text><text x="70" y="132" font-size="22" fill="#526780">Cross-chain payout instructions for a treasury on Portaldot V3</text><rect x="70" y="225" width="290" height="225" rx="12" fill="white" stroke="#d1dce9" stroke-width="2"/><text x="92" y="271" font-size="24" font-weight="700">Ethereum Sepolia</text><text x="92" y="319" font-size="19" fill="#526780">Owner-controlled outbox</text><text x="92" y="355" font-size="19" fill="#526780">Emits a payout request</text><text x="92" y="391" font-size="19" fill="#526780">No ETH escrow</text><path d="M365 340h35m-10-8 10 8-10 8" fill="none" stroke="#6a7e98" stroke-width="2"/><rect x="405" y="225" width="290" height="225" rx="12" fill="white" stroke="#d1dce9" stroke-width="2"/><text x="427" y="271" font-size="24" font-weight="700">Trusted RPC relay</text><text x="427" y="319" font-size="19" fill="#526780">Checks event + target</text><text x="427" y="355" font-size="19" fill="#526780">Waits 6 confirmations</text><text x="427" y="391" font-size="19" fill="#526780">Can be compromised</text><path d="M700 340h35m-10-8 10 8-10 8" fill="none" stroke="#6a7e98" stroke-width="2"/><rect x="740" y="225" width="290" height="225" rx="12" fill="white" stroke="#315adc" stroke-width="2"/><text x="762" y="271" font-size="24" font-weight="700">Airlock on V3</text><text x="762" y="319" font-size="19" fill="#526780">1 tPOT instant threshold</text><text x="762" y="355" font-size="19" fill="#526780">5 tPOT / 10-minute cap</text><text x="762" y="391" font-size="19" fill="#526780">120-second quarantine</text><path d="M1035 340h35m-10-8 10 8-10 8" fill="none" stroke="#6a7e98" stroke-width="2"/><rect x="1075" y="225" width="290" height="225" rx="12" fill="white" stroke="#d1dce9" stroke-width="2"/><text x="1097" y="271" font-size="24" font-weight="700">V3 treasury</text><text x="1097" y="319" font-size="19" fill="#526780">Pays native tPOT</text><text x="1097" y="355" font-size="19" fill="#526780">Reserves queued funds</text><text x="1097" y="391" font-size="19" fill="#526780">5 tPOT reserve floor</text><rect x="740" y="515" width="625" height="125" rx="12" fill="#e5efe9"/><text x="765" y="556" font-size="24" font-weight="700">Independent guardian</text><text x="765" y="591" font-size="20">Pause releases · cancel queued requests</text><text x="765" y="620" font-size="19">Policy changes and resume require 300 seconds</text><path d="M880 515v-60m-8 12 8-12 8 12" fill="none" stroke="#28634e" stroke-width="2"/><path d="M718 185v290" stroke="#b75442" stroke-width="2" stroke-dasharray="7 7"/><text x="70" y="539" font-size="22" font-weight="700">Trust boundary</text><text x="70" y="576" font-size="19">V3 enforces payout rules, not Ethereum consensus.</text><text x="70" y="610" font-size="19">The relay still attests the source event.</text><text x="70" y="721" font-size="20">Small malicious payouts within the cap remain possible. Fixed-window boundary bursts remain a risk.</text><text x="70" y="758" font-size="18" fill="#526780">Deployed on Portaldot V3 · chain 420420777 · controlled public-testnet evidence recorded 22 October 2026</text></g></svg>